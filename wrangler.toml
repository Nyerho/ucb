name = "ucb"
main = "worker.mjs"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
find_additional_modules = true
preserve_file_names = true
base_dir = "./views"

[build]
command = "npm run compile:worker-views"
watch_dir = "./views"

[[rules]]
type = "Text"
globs = ["**/*.ejs"]
fallthrough = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[vars]
NODE_ENV = "production"
WORKER_RUNTIME = "1"

# Never add secrets here. Configure these using Wrangler's secret manager:
# FIREBASE_PROJECT_ID, FIREBASE_API_KEY, FIREBASE_CLIENT_EMAIL,
# FIREBASE_PRIVATE_KEY (or FIREBASE_SERVICE_ACCOUNT_JSON),
# FIREBASE_STORAGE_BUCKET, SESSION_ENCRYPTION_KEY.
